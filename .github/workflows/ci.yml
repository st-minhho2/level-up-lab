name: ci

on:
  pull_request:
    # labeled/unlabeled: jobs read labels (hotfix, config-change-approved) from the event payload, and "Re-run" replays
    # the old payload, so only a new event sees a label a human just added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# CI can read, never write: it cannot push, merge or approve. Merge policy lives in the branch ruleset.
permissions:
  contents: read

# Per PR (refs/pull/<n>/merge): a push or label event cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth with .devcontainer/docker-compose.yml. Change both or neither.
  CI_IMAGE: node:24-bookworm
  # Hotfix lane (.claude/docs/git-workflow.md): PRs labelled "hotfix" run only lint, typecheck and unit tests.
  HOTFIX: ${{ contains(github.event.pull_request.labels.*.name, 'hotfix') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Unit + component tests with coverage
        run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  e2e:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'hotfix') }}
    runs-on: ubuntu-latest
    container: node:24-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: level_up_lab
        options: >-
          --health-cmd "pg_isready -U postgres -d level_up_lab"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/level_up_lab?schema=public
      PORT: '3000'
      NODE_ENV: test
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm db:deploy
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright against docker Postgres
        run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  mutation:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'hotfix') }}
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - name: Stryker on src/lib + src/actions (break < 70%)
        run: pnpm test:mutation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

  semgrep:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'hotfix') }}
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep scan --config p/default --config p/typescript --config p/secrets --error --metrics=off --exclude=.worktrees --exclude=node_modules

  guards:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'hotfix') }}
    runs-on: ubuntu-latest
    container: node:24-bookworm
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CONFIG_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'config-change-approved') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Push-safe: they read the diff or the tree, which a squash merge keeps.
      - name: No new eslint-disable / @ts-ignore / @ts-expect-error
        run: scripts/ci/check-suppressions.sh
      - name: Every acceptance criterion of a shipped section has a test
        run: scripts/ci/check-ac-coverage.sh
      - name: Cited spec sections exist
        run: scripts/ci/check-spec-sections.sh
      - name: Features map resolves
        run: scripts/ci/check-features-map.sh
      - name: Backlog board matches the cards
        run: scripts/ci/check-backlog.sh
      - name: Agent and skill frontmatter parses (else Claude Code skips the agent and its path-guard hook)
        run: scripts/ci/check-agent-frontmatter.sh
      # PR-only: a push to main carries no PR labels, and the squash merge folds the test(...) (red) and feat(...)
      # commits into one commit titled after the PR, so these would fail (or verify nothing) on every merge. The
      # ruleset forbids direct pushes, so each commit on main already passed them on its PR.
      - name: No lint / tsconfig / CI / hook changes without the config-change-approved label
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/ci/check-config-change.sh
      - name: feat(...) commits do not touch test files
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/ci/check-feat-commits.sh
      - name: test(...) commits are red for the right reason
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/verify-red.sh --auto
