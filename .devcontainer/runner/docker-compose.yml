# The runner's sandbox (B1.58): a compose project of its own, so it shares no network, volume or database with
# ../../docker-compose.yml or the dev container. The workspace is a clone in the runner-repo volume, never the host's
# checkout (plan decision 1). Every exec runs as node (`-u node`): a root exec keeps NET_ADMIN and could undo the
# firewall. The lead's commands, from the host checkout:
#   docker compose -f .devcontainer/runner/docker-compose.yml up -d --build
#   docker compose -f .devcontainer/runner/docker-compose.yml exec -u node runner gh auth login
#   docker compose -f .devcontainer/runner/docker-compose.yml exec -u node runner gh auth setup-git
#   docker compose -f .devcontainer/runner/docker-compose.yml exec -u node runner git clone https://github.com/st-minhho2/level-up-lab.git .
#   docker compose -f .devcontainer/runner/docker-compose.yml exec -u node runner claude auth login
#   docker compose -f .devcontainer/runner/docker-compose.yml exec -u node runner scripts/agent/sandbox-probe.sh
#   docker compose -f .devcontainer/runner/docker-compose.yml exec -u node runner scripts/agent/run.sh --check-binary
# Logins live only in the runner-claude and runner-gh volumes; after a suspect run remove the volumes
# (`docker compose -f .devcontainer/runner/docker-compose.yml down -v`) and log in again.
name: level-up-lab-runner
services:
  runner:
    build: .
    # NET_ADMIN, NET_RAW: init-firewall.sh's iptables and ipset; SETUID, SETGID, SETPCAP: its setpriv to node with an
    # empty bounding set. Nothing else. An exec as node starts with no effective capability (sandbox-probe.sh S5).
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, SETUID, SETGID, SETPCAP]
    security_opt: ['no-new-privileges:true']
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
    working_dir: /home/node/level-up-lab
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    volumes:
      - runner-repo:/home/node/level-up-lab
      - runner-claude:/home/node/.claude
      - runner-gh:/home/node/.config/gh
      # run.sh's RUNNER_RUNS default ($HOME/.level-up-lab/runs): logs, verified-versions, stop marks survive a rebuild
      - runner-runs:/home/node/.level-up-lab
      - runner-pnpm-store:/home/node/.local/share/pnpm/store

volumes:
  runner-repo:
  runner-claude:
  runner-gh:
  runner-runs:
  runner-pnpm-store:
