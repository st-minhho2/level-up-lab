# The runner's sandbox (B1.58): a compose project of its own, so it shares no network, volume or database with
# ../../docker-compose.yml or the dev container. Two services from one image: `firewall` (root, NET_ADMIN, NET_RAW
# only) applies init-firewall.sh's allow list to a network namespace that `runner` joins with no capability at all, so
# no exec into `runner`, root included, can change the rules. The workspace is a clone in the runner-repo volume,
# never the host's checkout (plan decision 1). The lead's commands, from the host checkout (the branch until merged):
#   docker compose -f .devcontainer/runner/docker-compose.yml up -d --build --wait     (cold build ~5 min, B1.62)
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner gh auth login
# (no `gh auth setup-git`: the image sets GitHub's credential helper at system scope, where the PR wrapper sees it, B1.76)
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner git clone https://github.com/st-minhho2/level-up-lab.git .
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner git checkout chore/B1.62-runner-image-probes
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner claude auth login
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner sh -c 'umask 077; f=~/.claude/.claude.json; jq ".projects[\"/home/node/level-up-lab\"].hasTrustDialogAccepted = true" "$f" > "$f.tmp" && mv "$f.tmp" "$f"'
# (that line trusts the clone, as claude's own "workspace has not been trusted" message suggests; an interactive
# `claude` asks for the organization's managed settings first, a separate decision the runner does not need)
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner git config --global user.name "level-up-lab runner"
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner git config --global user.email "runner@level-up-lab.invalid"
# (the identity the runner's commits carry: a named bot, not the lead's own; GIT_CONFIG_GLOBAL below keeps it in the
# runner-runs volume, so it survives a rebuild and is lost only by `down -v`; run.sh refuses a run without it, B1.69)
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner scripts/agent/sandbox-probe.sh   → "12 probes OK"
#   docker compose -f .devcontainer/runner/docker-compose.yml exec -e RUNNER_BUDGET_USD=1 runner scripts/agent/run.sh --check-binary
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner sh -c 'git fetch origin && git merge --ff-only origin/main'
# (before each batch: run.sh fetches origin and refuses an issue while the clone's HEAD is behind origin/main, printing
# the count, both shas and this fix, since the run.sh it runs is the clone's own copy; B1.95)
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner scripts/agent/run.sh --sync <issue>
# (after each merge in a batch, once per other ready runner PR: GitHub's merge ignores `merge=union` and the ruleset
# wants the branch up to date; --sync merges origin/main here, runs the table guards and pushes with `Agent-Run: sync`,
# no claude run; a refusal names `run.sh <issue>`, whose Loop 9 resolves it; B1.101)
#   docker compose -f .devcontainer/runner/docker-compose.yml stop
#   docker compose -f .devcontainer/runner/docker-compose.yml up -d --wait
#   docker compose -f .devcontainer/runner/docker-compose.yml exec runner scripts/agent/sandbox-probe.sh   → "12 probes OK"
# Logins live only in the runner-claude and runner-gh volumes (git's global config in runner-runs); after a suspect run
# remove them (`docker compose -f .devcontainer/runner/docker-compose.yml down -v`) and log in again.
name: level-up-lab-runner
services:
  firewall:
    build: .
    user: root
    entrypoint: ['/usr/local/bin/init-firewall.sh']
    command: ['sleep', 'infinity']
    init: true
    # /run in memory, so the ready mark of an earlier start never survives a stop (diff review 2 #1)
    tmpfs: [/run]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt: ['no-new-privileges:true']
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
    # ready only after the allow list passed its own check both ways; a failed check exits, and runner never starts
    healthcheck:
      test: ['CMD', 'test', '-e', '/run/level-up-lab-firewall-ready']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 60s
  runner:
    build: .
    network_mode: service:firewall
    depends_on:
      firewall:
        condition: service_healthy
    init: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # the image's CMD (runner-postgres.sh) starts a fresh Postgres here at every start: nothing survives a stop
    # (B1.62); the short form, because the long form has no uid
    tmpfs: ['/home/node/pgdata:uid=1000,gid=1000,mode=0700,size=512m']
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-h', '127.0.0.1', '-p', '5433']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 30s
    working_dir: /home/node/level-up-lab
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      GIT_CONFIG_GLOBAL: /home/node/.level-up-lab/gitconfig
    volumes:
      - runner-repo:/home/node/level-up-lab
      - runner-claude:/home/node/.claude
      - runner-gh:/home/node/.config/gh
      # run.sh's RUNNER_RUNS default ($HOME/.level-up-lab/runs): logs, verified-versions, stop marks survive a rebuild
      - runner-runs:/home/node/.level-up-lab
      - runner-pnpm-store:/home/node/.local/share/pnpm/store

volumes:
  runner-repo:
  runner-claude:
  runner-gh:
  runner-runs:
  runner-pnpm-store:
