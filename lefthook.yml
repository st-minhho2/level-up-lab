# Pre-commit gate. Budget: < 30 s on a warm machine (measured in .claude/docs/hooks.md). Lint and format run on
# staged files only; tsc is whole-project because types cross files. Emergency bypass: LEFTHOOK=0 git commit,
# with the reason in the commit body; CI still runs the full gate.
# Installed by scripts/install-hooks.sh (B1.19) with the main checkout's binary. No reachable lefthook stops the commit
# (assert); a commit never re-installs the hooks itself (no_auto_install): only `pnpm install` (prepare) does.
assert_lefthook_installed: true
no_auto_install: true

pre-commit:
  piped: true # node-modules first: without it every other job fails with "Command not found"
  jobs:
    - name: node-modules
      run: test -d node_modules
      fail_text: 'this checkout has no node_modules: run pnpm install --frozen-lockfile in it'
    - name: gate
      group:
        parallel: true
        jobs:
          - name: repo-hooks
            run: scripts/require-hooks.sh
          - name: prettier
            glob: '*.{ts,tsx,mts,mjs,js,json,md,yml,yaml,css}'
            run: pnpm exec prettier --check {staged_files}
          - name: eslint
            glob: '*.{ts,tsx,mts,mjs}'
            run: pnpm exec eslint --no-warn-ignored {staged_files}
          - name: tsc
            run: pnpm exec tsc --noEmit
          - name: gitleaks
            run: |
              if command -v gitleaks >/dev/null 2>&1; then
                gitleaks git --pre-commit --staged --redact --no-banner
              else
                echo "gitleaks not installed (brew install gitleaks); skipping local secret scan, CI runs it" >&2
              fi

commit-msg:
  jobs:
    - name: conventional-subject
      run: |
        subject="$(head -1 {1})"
        echo "$subject" | grep -Eq '^(Merge|Revert) ' && exit 0
        echo "$subject" | grep -Eq '^(feat|fix|chore|docs|test|refactor|ci|build|perf|style|revert)(\([A-Za-z0-9_./-]+\))?!?: .{1,72}$' \
          || { echo "commit subject must be Conventional Commits: <type>(<scope>): <summary>  (got: $subject)" >&2; exit 1; }

# B1.57 (D-29): a commit made inside a runner's run (scripts/agent/run.sh exports RUNNER_CHILD to every tool call) carries
# `Agent-Run: <RUNNER_CHILD>`, so scripts/metrics/no-rework.sh tells it from a human's. prepare-commit-msg, not
# commit-msg: only it also runs for `git revert --no-edit` and `git cherry-pick`. A clean merge's message has no final
# newline, without which the trailer would join the subject.
prepare-commit-msg:
  jobs:
    - name: agent-run
      run: |
        [ -n "${RUNNER_CHILD:-}" ] || exit 0
        [ -z "$(tail -c 1 {1})" ] || echo >> {1}
        git interpret-trailers --in-place --if-exists replace --trailer "Agent-Run: $RUNNER_CHILD" {1}
